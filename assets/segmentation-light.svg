<text x="46" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#54736b">Suricata IDS/IPS en coupure  ·  Unbound en DNS split-horizon  ·  toute ouverture est écrite et journalisée</text>
