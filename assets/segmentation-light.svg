<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 702" width="960" height="702" role="img" aria-labelledby="t d">
<title id="t">Segmentation du banc d'essai</title>
<desc id="d">Internet et l'accès distant Zero Trust convergent vers un pare-feu OPNsense avec Suricata en coupure, qui dessert six VLAN isolés : DMZ, services, sécurité, management, formation et laboratoire cloisonné. Les sauvegardes sont chiffrées, sorties hors site et rejouées dans un bac à sable réseau isolé.</desc>
